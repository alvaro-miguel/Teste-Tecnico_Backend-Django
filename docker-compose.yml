version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=agendamentos_db
      - POSTGRES_USER=usuario_db
      - POSTGRES_PASSWORD=senha123
    volumes:
      - postgres_data:/var/lib/postgresql/data  
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate && 
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - POSTGRES_HOST=db

volumes:
  postgres_data: