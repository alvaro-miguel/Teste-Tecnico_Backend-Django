services:
  - type: web
    runtime: static
    name: frontend-agendamentos-ixzf
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://api-agendamentos-ixzf.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
